# Demostración gratuita. El almacenamiento de este plan es temporal.
# No incluye disco ni contrata servicios de pago.
services:
  - type: web
    name: atelier-store
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: HOST
        value: 0.0.0.0
